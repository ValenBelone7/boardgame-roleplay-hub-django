services:
  - type: web
    name: arcana-api-efi
    runtime: python
    plan: free
    region: virginia
    branch: deploy
    buildCommand: bash build.sh
    startCommand: cd src && gunicorn nucleo.wsgi:application
    healthCheckPath: /api/categorias/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: CORS_ORIGINS
        sync: false
